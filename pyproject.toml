[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topos-power"
version = "1.0.0"
description = "A cross-platform power timer for shutdown, sleep and display control."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
]

[project.scripts]
topos-power = "topos_power.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
topos_power = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
